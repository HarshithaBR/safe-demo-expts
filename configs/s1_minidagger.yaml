env_id: "SafetyPointGoal1-v0"
deploy_margin: 0.14
oracle_margin: 0.04
device: cpu
stuck_horizon: 40
max_steps: 500
collect_variant: V3b
collect_budget: 40
collect_episodes: 40
collect_seed: 21
max_interventions_per_episode: 5
# Freeze deploy so stuck occurs; oracle actions use escape-exec in evaluate_flexible.
escape_mode: false
ft_epochs: 25
ft_lr: 0.0005
mix_original_demos: true
safe_ft_lr: 0.0001
safe_ft_epochs: 10
demo_dir: "data/demos"
checkpoint_dir: "results/checkpoints"
ft_checkpoint_dir: "results/checkpoints_ft"
policy_seed: 0
n_demos: 40
train_epochs: 60
n_eval: 20
eval_seed: 77
v3_disagree_tol: 0.45
v3_max_steps: 40
smoke_n_eval: 4
smoke_collect_episodes: 8
smoke_ft_epochs: 5
policies:
  - {illegal_level: mid, mode: A, use_history: false, tag: A_nohist}
  - {illegal_level: mid, mode: C, use_history: false, tag: C_nohist}
  - {illegal_level: mid, mode: C, use_history: true, tag: C_hist}
